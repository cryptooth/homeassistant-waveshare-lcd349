<svg width="344" height="1280" viewBox="0 0 172 640" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- Device frame -->
  <rect width="172" height="640" fill="#101418"/>

  <!-- Top status bar -->
  <rect x="0" y="0" width="172" height="50" fill="#0b0d10"/>
  <text x="10" y="32" font-size="22" font-weight="600" fill="#ffffff">17:32</text>

  <!-- Slot 1: Light ON, yellow -->
  <rect x="6" y="60" width="77" height="125" rx="14" fill="#fbbf24"/>
  <text x="44" y="38" font-size="32" fill="#1a1a1a" text-anchor="middle" transform="translate(0,25)">💡</text>
  <text x="44" y="135" font-size="14" font-weight="600" fill="#1a1a1a" text-anchor="middle">Ceiling</text>
  <text x="44" y="160" font-size="12" fill="#2a2a2a" text-anchor="middle">75%</text>

  <!-- Slot 2: Switch OFF, gray -->
  <rect x="89" y="60" width="77" height="125" rx="14" fill="#1c2128"/>
  <text x="127" y="100" font-size="30" fill="#ffffff" text-anchor="middle">⏻</text>
  <text x="127" y="135" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Spot</text>
  <text x="127" y="160" font-size="12" fill="#a0a0a0" text-anchor="middle">Off</text>

  <!-- Slot 3: Light OFF -->
  <rect x="6" y="190" width="77" height="125" rx="14" fill="#1c2128"/>
  <text x="44" y="230" font-size="30" fill="#ffffff" text-anchor="middle">💡</text>
  <text x="44" y="265" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Kitchen</text>
  <text x="44" y="290" font-size="12" fill="#a0a0a0" text-anchor="middle">Off</text>

  <!-- Slot 4: Switch ON -->
  <rect x="89" y="190" width="77" height="125" rx="14" fill="#fbbf24"/>
  <text x="127" y="230" font-size="30" fill="#1a1a1a" text-anchor="middle">⏻</text>
  <text x="127" y="265" font-size="14" font-weight="600" fill="#1a1a1a" text-anchor="middle">OU5</text>
  <text x="127" y="290" font-size="12" fill="#2a2a2a" text-anchor="middle">On</text>

  <!-- Slot 5: Sensor (temperature) -->
  <rect x="6" y="320" width="77" height="125" rx="14" fill="#1c2128"/>
  <text x="44" y="360" font-size="28" fill="#60a5fa" text-anchor="middle">🌡</text>
  <text x="44" y="395" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">22.3°C</text>
  <text x="44" y="420" font-size="12" fill="#a0a0a0" text-anchor="middle">Outdoor</text>

  <!-- Slot 6: Sensor (humidity) -->
  <rect x="89" y="320" width="77" height="125" rx="14" fill="#1c2128"/>
  <text x="127" y="360" font-size="28" fill="#60a5fa" text-anchor="middle">💧</text>
  <text x="127" y="395" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">45%</text>
  <text x="127" y="420" font-size="12" fill="#a0a0a0" text-anchor="middle">Humidity</text>

  <!-- Slot 7: Scene -->
  <rect x="6" y="450" width="77" height="125" rx="14" fill="#1c2128"/>
  <text x="44" y="490" font-size="30" fill="#ffffff" text-anchor="middle">▶</text>
  <text x="44" y="525" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Movie</text>

  <!-- Slot 8: Script -->
  <rect x="89" y="450" width="77" height="125" rx="14" fill="#1c2128"/>
  <text x="127" y="490" font-size="28" fill="#ffffff" text-anchor="middle">📜</text>
  <text x="127" y="525" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Goodnight</text>

  <!-- Bottom nav -->
  <rect x="4" y="580" width="44" height="56" rx="8" fill="#1c2128"/>
  <text x="26" y="617" font-size="22" fill="#ffffff" text-anchor="middle">◀</text>

  <text x="86" y="603" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Living Room</text>
  <text x="86" y="625" font-size="12" fill="#a0a0a0" text-anchor="middle">1/3</text>

  <rect x="124" y="580" width="44" height="56" rx="8" fill="#1c2128"/>
  <text x="146" y="617" font-size="22" fill="#ffffff" text-anchor="middle">▶</text>
</svg>
