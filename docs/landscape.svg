<svg width="1280" height="344" viewBox="0 0 640 172" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- Device frame -->
  <rect width="640" height="172" fill="#101418"/>

  <!-- Top-right status cluster -->
  <text x="540" y="22" font-size="14" fill="#a0a0a0" text-anchor="middle">📶</text>
  <text x="592" y="22" font-size="14" fill="#a0a0a0" text-anchor="end">85%</text>
  <!-- Battery icon (drawn) -->
  <rect x="603" y="12" width="22" height="10" rx="2" stroke="#a0a0a0" stroke-width="1" fill="none"/>
  <rect x="625" y="14" width="3" height="6" fill="#a0a0a0"/>
  <rect x="605" y="14" width="18" height="6" fill="#10b981"/>

  <!-- Big clock -->
  <text x="320" y="115" font-family="'KodeMono', monospace" font-size="100" font-weight="700" fill="#ffffff" text-anchor="middle">17:32</text>

  <!-- Bottom-left outdoor temp -->
  <text x="10" y="160" font-size="22" font-weight="600" fill="#60a5fa">22.3°C</text>

  <!-- Bottom-right indoor temp -->
  <text x="630" y="160" font-size="22" font-weight="600" fill="#fbbf24" text-anchor="end">25.0°C</text>
</svg>
