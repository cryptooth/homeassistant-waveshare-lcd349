            x: 124
            y: 580
            width: 44
            height: 56
            bg_color: 0x1c2128
            bg_opa: COVER
            radius: 8
            border_width: 0
            pressed:
              bg_color: 0x4a5260
            widgets:
              - label:
                  text: "\U000F0142"
                  text_font: font_icons
                  text_color: 0xffffff
                  align: CENTER
            on_short_click:
              - if:
                  condition: { lambda: 'return !id(is_swiping);' }
                  then:
                    - script.execute: navigate_next

    # ═══════════════ DASHBOARD (yatay konumda otomatik geçer) ═══════════════
    # Tüm içerik tek bir "rot_container" altında. Container 640×172 landscape
    # kanvasında düşünülüyor, transform_angle:2700 (90° CCW) ile fiziksel
    # 172×640 dikey ekrana oturuyor. Container'ı (x=172,y=0) pozisyonlayınca
    # pivot (0,0) etrafında rotasyon ekranı tam kaplar.
    # → Eğer cihaz ters yönde tutuluyorsa transform_angle: 900 yap (90° CW).
    - id: scr_dashboard
      scrollable: false
      scrollbar_mode: 'OFF'
      bg_color: 0x101418
      bg_opa: COVER
      widgets:
        # Sağ-üst köşedeki inatçı piksel maskesi (rot_container'dan önce, en altta)
        - obj:
            x: 168
            y: 0
            width: 4
            height: 4
            bg_color: 0x101418
            bg_opa: COVER
            border_width: 0
            pad_all: 0
        - obj:
            id: rot_container
            x: 172
            y: 0
            width: 640
            height: 172
            bg_color: 0x101418
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            scrollable: false
            transform_rotation: 90
            widgets:
              # ─── BÜYÜK SAAT (yatay tam merkez, 100pt Bold)
              - label:
                  id: lbl_clock_big
                  x: 70
                  y: 30
                  width: 500
                  height: 110
                  text: "--:--"
                  text_align: CENTER
                  text_color: 0xffffff
                  text_font: font_clock_xl

              # ─── Dış sıcaklık (yatay sol-ALT köşe)
              - label:
                  id: lbl_out_temp
                  x: 10
                  y: 138
                  width: 150
                  height: 30
                  text: "--°"
                  text_align: LEFT
                  text_color: 0x60a5fa
                  text_font: montserrat_22

              # ─── İç sıcaklık (yatay sağ-ALT köşe)
              - label:
                  id: lbl_in_temp
                  x: 480
                  y: 138
                  width: 150
                  height: 30
                  text: "--°"
                  text_align: RIGHT
                  text_color: 0xfbbf24
                  text_font: montserrat_22

              # ─── Sağ-üst status cluster: WiFi + yüzde + Pil bar (hepsi sağa yaslı)
              - image:
                  id: img_wifi_widget
                  x: 540
                  y: 8
                  src: img_wifi_off

              - label:
                  id: lbl_batt_pct
                  x: 568
                  y: 10
                  width: 30
                  height: 20
                  text: "--%"
                  text_align: RIGHT
                  text_color: 0xa0a0a0
                  text_font: montserrat_14

              # Pil gövdesi (dinamik dolan bar — yeşil/sarı/kırmızı)
              - bar:
                  id: bar_batt
                  x: 605
                  y: 10
                  width: 26
                  height: 14
                  min_value: 0
                  max_value: 100
                  value: 50
                  bg_color: 0x1a1f26
                  bg_opa: COVER
                  border_width: 2
                  border_color: 0xa0a0a0
                  radius: 3
                  pad_all: 2
                  indicator:
                    bg_color: 0x10b981
                    radius: 1

              # Pil ucu (sağa doğru çıkıntı)
              - obj:
                  x: 631
                  y: 14
                  width: 3
                  height: 6
                  bg_color: 0xa0a0a0
                  bg_opa: COVER
                  border_width: 0
                  radius: 1

              # ─── Tarih (gizli, handler bağlı kalsın diye burada)
              - label:
                  id: lbl_date
                  x: 0
                  y: -100
                  width: 50
                  height: 20
                  text: ""
                  text_color: 0xa0a0a0
                  text_font: montserrat_14

# ─────────────────────────────────────────── Işık state'leri → buton görünümü
# Açıkken sarı, kapalıyken koyu gri olur.
# Not: aşağıdaki binary_sensor on_state'leri ile butonları senkronize ediyoruz.
# (Yukarıda binary_sensor tanımları var; burada UI senkronizasyonu yapılıyor.)

