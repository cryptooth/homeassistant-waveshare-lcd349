# =============================================================================
#  Waveshare ESP32-S3-Touch-LCD-3.49  →  Home Assistant dokunmatik kumanda
#  Yatay/dikey çalışan, IMU ile yön algılayan, ışık + sahne kontrollü panel.
#
#  Donanım pinleri Waveshare örnek kodundan (user_config.h) alındı.
#  Display: AXS15231 (QSPI), Touch: AXS15231 (I2C 0x3b), IMU: QMI8658 (I2C 0x6b),
#  RTC: PCF85063 (I2C 0x51), IO Expander: TCA9554 (I2C 0x20), Codec, SD, Pil.
#
#  KURULUM ADIMLARI README.md dosyasında.
# =============================================================================

substitutions:
  device_name: "ha-touch-panel"
  friendly_name: "HA Touch Panel"
  # ───────── Touch Panel Manager entity'leri (HA custom integration)
  # HA'da Settings → Devices → Touch Panel Manager → <panel adın> üzerinden bul.
  # Üç entity: config (8 slot için flat attribute'lar), outdoor proxy, indoor proxy.
  panel_config_entity:  "sensor.touch_panel_config"
  panel_outdoor_proxy:  "sensor.touch_panel_outdoor_temp"
  panel_indoor_proxy:   "sensor.touch_panel_indoor_temp"
  date_entity:          "sensor.date"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2025.5.0
  on_boot:
    - priority: 600
      then:
        - light.turn_on:           # ekran arka ışığı
            id: backlight
            brightness: 80%
    # TCA9554 power latch + QMI8658 IMU init (priority -100 → i2c bus'tan sonra)
    - priority: -100
      then:
        - lambda: |-
            auto *bus = id(bus_esp);

            // ─── TCA9554 power latch (pin 6 HIGH → USB çıkınca bataryadan beslenir)
            // TCA9554: 0x00=in, 0x01=out, 0x03=config (0=output,1=input). I2C addr 0x20.
            uint8_t cmd[2];
            uint8_t r;
            // Config: pin 6'yı output yap, diğerlerini bozma (read-modify-write)
            r = 0x03; uint8_t cfg = 0xFF;
            bus->write(0x20, &r, 1, false);
            bus->read(0x20, &cfg, 1);
            cfg &= ~(1 << 6);
            cmd[0] = 0x03; cmd[1] = cfg;
            bus->write(0x20, cmd, 2);
            // Output: pin 6'yı HIGH yap
            r = 0x01; uint8_t out = 0;
            bus->write(0x20, &r, 1, false);
            bus->read(0x20, &out, 1);
            out |= (1 << 6);
            cmd[0] = 0x01; cmd[1] = out;
            bus->write(0x20, cmd, 2);
            ESP_LOGI("power", "TCA9554 power latch ON (pin6=HIGH, batarya beslemesi aktif)");

            // ─── QMI8658 IMU
            uint8_t reg2 = 0x00, who = 0;
            if (bus->write(0x6B, &reg2, 1, false) != esphome::i2c::ERROR_OK ||
                bus->read(0x6B, &who, 1) != esphome::i2c::ERROR_OK) {
              ESP_LOGW("imu", "QMI8658 cevap vermiyor (i2c err)");
              return;
            }
            ESP_LOGI("imu", "QMI8658 WHO_AM_I=0x%02X (beklenen 0x05)", who);
            // CTRL1=0x40 : auto-increment register address (sequential read için)
            cmd[0] = 0x02; cmd[1] = 0x40; bus->write(0x6B, cmd, 2);
            // CTRL2=0x16 : accel ±4g (aFS=001), ODR 125Hz (aODR=0110)
            cmd[0] = 0x03; cmd[1] = 0x16; bus->write(0x6B, cmd, 2);
            // CTRL7=0x01 : sadece accelerometer aktif (gyro şimdilik kapalı, güç tasarrufu)
            cmd[0] = 0x08; cmd[1] = 0x01; bus->write(0x6B, cmd, 2);
            ESP_LOGI("imu", "QMI8658 init OK");

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

# AXS15231 framebuffer + LVGL için PSRAM şart
psram:
  mode: octal
  speed: 80MHz

# ─────────────────────────────────────────── WiFi / API / OTA
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name} Fallback"
    password: "kurulum1234"

captive_portal:

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key
  # HA bağlandığında / yeniden bağlandığında initial state push'larından sonra
  # buton checked durumlarını manuel sync et — binary_sensor'ün on_state'i bazen
  # initial subscribe'da yutuluyor, buton stale kalıyor.
  on_client_connected:
    - delay: 2s
    - script.execute: refresh_button_states

ota:
  - platform: esphome
    password: !secret ota_password

# ─────────────────────────────────────────── Dış (External) component'lar
# NOT: dala318/esphome-qmi8658 yeni ESP-IDF i2c_master (NG) driver kullanıyor,
# ESPHome'un i2c: component'i ise legacy driver. Aynı anda çalışmıyorlar
# ("CONFLICT! driver_ng is not allowed to be used with this old driver" panic).
# IMU'yu şimdilik kapalı tutuyoruz; legacy i2c uyumlu bir alternatifle döneriz.
# external_components:
#   - source: github://dala318/esphome-qmi8658
#     components: [qmi8658]

# ─────────────────────────────────────────── Custom fontlar
# KodeMonoRegular.ttf'yi 140pt'ye render edip büyük saat fontu olarak kullanıyoruz.
font:
  - id: font_clock_xl
    file: "fonts/KodeMonoBold.ttf"
    size: 100
    glyphs: "0123456789:-"

  # Material Design Icons — slot ikonları için
  # Sadece kullanılan glyph'leri dahil et, font ufak kalır
  - id: font_icons
    file: "fonts/materialdesignicons.ttf"
    size: 32
    glyphs: [
      "\U000F0335",  # lightbulb
      "\U000F06D5",  # toggle-switch-outline
      "\U000F0521",  # toggle-switch (filled)
      "\U000F040A",  # play-circle-outline (scene/media)
      "\U000F0BC1",  # script-text-outline
      "\U000F0A22",  # robot (automation)
      "\U000F0210",  # fan
      "\U000F1486",  # window-shutter (cover)
      "\U000F0D91",  # motion-sensor (binary_sensor)
      "\U000F050F",  # thermometer
      "\U000F058C",  # water-percent (humidity)
      "\U000F0079",  # battery
      "\U000F0AF6",  # flash (power/voltage)
      "\U000F0274",  # lightning-bolt (energy)
      "\U000F0260",  # gauge (pressure)
      "\U000F0625",  # help-circle-outline (default)
      "\U000F0141",  # chevron-left (prev page)
      "\U000F0142",  # chevron-right (next page)
    ]

# ─────────────────────────────────────────── İkonlar (PNG → LVGL image)
image:
  - id: img_wifi_on
    file: "images/wifi_on.png"
    type: RGB565
    transparency: alpha_channel
  - id: img_wifi_off
    file: "images/wifi_off.png"
    type: RGB565
    transparency: alpha_channel
  - id: img_battery
    file: "images/battery.png"
    type: RGB565
    transparency: alpha_channel

# ─────────────────────────────────────────── SPI (Quad / QSPI) — Display
spi:
  id: quad_spi
  type: quad
  clk_pin: GPIO10
  data_pins: [GPIO11, GPIO12, GPIO13, GPIO14]

# ─────────────────────────────────────────── I2C — Touch (ayrı bus)
i2c:
  - id: bus_touch
    sda: GPIO17
    scl: GPIO18
    frequency: 400kHz
    scan: true   # boot log'unda 0x3b (touch) görünmeli

  # ─────────────────────────────────────── I2C — Genel (IMU, RTC, IO expander, codec)
  - id: bus_esp
    sda: GPIO47
    scl: GPIO48
    frequency: 400kHz
    scan: true   # boot'ta ne var ne yok log'a düşsün

# ─────────────────────────────────────────── Arka ışık (PWM)
output:
  - platform: ledc
    pin: GPIO8
    id: backlight_pwm
    frequency: 5000Hz
    inverted: true   # HA'da ON = ekran aydınlık olacak

light:
  - platform: monochromatic
    id: backlight
    name: "Ekran Arka Işığı"
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 200ms

# ─────────────────────────────────────────── Ekran (AXS15231, 172x640 portrait)
display:
  - platform: qspi_dbi
    id: lcd
    model: AXS15231
    spi_id: quad_spi
    cs_pin: GPIO9
    reset_pin: GPIO21
    data_rate: 40MHz
    spi_mode: mode0
    dimensions:
      width: 172
      height: 640
    color_order: rgb
    invert_colors: false
    brightness: 255
    draw_from_origin: true
    draw_rounding: 16           # AXS15231 partial-draw hizalama (alt kenar artifact'larını engeller)
    update_interval: never        # LVGL kendi tetikler
    auto_clear_enabled: false

# ─────────────────────────────────────────── Dokunmatik
touchscreen:
  - platform: axs15231
    id: touch
    i2c_id: bus_touch
    display: lcd
    transform:
      mirror_x: false
      mirror_y: true
      swap_xy: true
    # Swipe gesture: yatay 60+ px hareketi sayfa geçişi olarak yorumla.
    # LVGL kendi click'lerini movement < threshold koşulunda fireledği için
    # tap'lar burayla çakışmaz (büyük hareket = swipe, küçük = click).
    on_touch:
      - lambda: |-
          id(touch_start_x) = touch.x;
          id(touch_start_y) = touch.y;
          id(touch_last_x) = touch.x;
          id(touch_last_y) = touch.y;
          id(touch_start_ms) = millis();
          id(is_swiping) = false;
          ESP_LOGD("swipe", "touch start (%d, %d)", touch.x, touch.y);
    on_update:
      - lambda: |-
          if (touches.empty()) return;
          const auto &t = touches.front();
          id(touch_last_x) = t.x;
          id(touch_last_y) = t.y;
          // Belirgin yatay hareket varsa swipe flag'ini set et
          // → buton on_short_click'i bunu görüp tıklamayı yutar
          int dx = abs((int) t.x - (int) id(touch_start_x));
          int dy = abs((int) t.y - (int) id(touch_start_y));
          if (dx > 30 && dx > dy) id(is_swiping) = true;
    on_release:
      - lambda: |-
          if (id(touch_start_x) < 0) return;
          int dx = (int) id(touch_last_x) - (int) id(touch_start_x);
          int dy = (int) id(touch_last_y) - (int) id(touch_start_y);
          uint32_t dt = millis() - id(touch_start_ms);
          ESP_LOGI("swipe", "release dx=%d dy=%d dt=%u", dx, dy, (unsigned) dt);
          id(touch_start_x) = -1;  // reset

          // Swipe: <800ms, |dx|>40, |dy|<80 (gevşetildi)
          if (dt < 800 && abs(dx) > 40 && abs(dy) < 80) {
            ESP_LOGI("swipe", "→ %s", dx < 0 ? "next" : "prev");
            if (dx < 0) id(navigate_next).execute();
            else        id(navigate_prev).execute();
          }

# ─────────────────────────────────────────── IMU (QMI8658) — raw i2c lambda
# Init on_boot priority:-100 bloğunda. Burada accel x/y/z'yi 500ms'de bir
# okuyup template sensor'lara yazıyoruz; HA'da görünür, lambda'larda kullanılır.
sensor:
  - platform: template
    name: "IMU Accel X"
    id: accel_x
    unit_of_measurement: "g"
    accuracy_decimals: 2
  - platform: template
    name: "IMU Accel Y"
    id: accel_y
    unit_of_measurement: "g"
    accuracy_decimals: 2
  - platform: template
    name: "IMU Accel Z"
    id: accel_z
    unit_of_measurement: "g"
    accuracy_decimals: 2

  # ─── Batarya voltajı (GPIO4, 1/3 divider, x3 ile gerçek pil voltajı)
  - platform: adc
    pin: GPIO4
    id: batt_voltage
    name: "Batarya Voltajı"
    update_interval: 30s
    attenuation: 12db
    accuracy_decimals: 2
    unit_of_measurement: "V"
    filters:
      - multiply: 3.0       # ekranda 1/3 divider var
      - sliding_window_moving_average:
          window_size: 5
          send_every: 5

  # ─── Batarya yüzdesi (Li-ion 18650 lineer yaklaşım: 3.3V=%0, 4.2V=%100)
  - platform: template
    name: "Batarya"
    id: batt_percent
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      float v = id(batt_voltage).state;
      if (isnan(v)) return {};
      float pct = (v - 3.3f) / (4.2f - 3.3f) * 100.0f;
      if (pct < 0) pct = 0;
      if (pct > 100) pct = 100;
      return pct;
    on_value:
      - lvgl.label.update:
          id: lbl_batt_pct
          text: !lambda |-
            char buf[8];
            snprintf(buf, sizeof(buf), "%d%%", (int) x);
            return std::string(buf);
      - lvgl.bar.update:
          id: bar_batt
          value: !lambda 'return (int) x;'
          indicator:
            bg_color: !lambda |-
              if (x < 20) return lv_color_hex(0xef4444);   // kırmızı
              if (x < 50) return lv_color_hex(0xfbbf24);   // sarı
              return lv_color_hex(0x10b981);                // yeşil

# ─────────────────────────────────────────── HA'dan çekilen entity'ler (state import)
# (text_sensor bloğu aşağıda IMU yön sensoru ile birleşik tanımlandı.)

binary_sensor:
  # WiFi bağlantı durumu — ikon swap için
  - platform: status
    name: "WiFi"
    id: wifi_connected
    on_state:
      - if:
          condition:
            lambda: 'return x;'
          then:
            - lvgl.image.update:
                id: img_wifi_widget
                src: img_wifi_on
          else:
            - lvgl.image.update:
                id: img_wifi_widget
                src: img_wifi_off

  # ──── Touch Panel Manager slot state proxy'leri (v0.4)
  # Her slot için HA tarafında bir binary_sensor proxy var; o slot'a atanmış
  # entity 'açık' olduğunda binary_sensor 'on' olur. Cihaz bunu görüp butonu
  # checked (sarı) state'e geçirir.
  - platform: homeassistant
    id: slot1_state
    entity_id: binary_sensor.touch_panel_slot_1_state
    on_state:
      - lvgl.widget.update:
          id: btn_l1
          state: { checked: !lambda 'return x;' }
  - platform: homeassistant
    id: slot2_state
    entity_id: binary_sensor.touch_panel_slot_2_state
    on_state:
      - lvgl.widget.update:
          id: btn_l2
          state: { checked: !lambda 'return x;' }
  - platform: homeassistant
    id: slot3_state
    entity_id: binary_sensor.touch_panel_slot_3_state
    on_state:
      - lvgl.widget.update:
          id: btn_l3
          state: { checked: !lambda 'return x;' }
  - platform: homeassistant
    id: slot4_state
    entity_id: binary_sensor.touch_panel_slot_4_state
    on_state:
      - lvgl.widget.update:
          id: btn_l4
          state: { checked: !lambda 'return x;' }
  - platform: homeassistant
    id: slot5_state
    entity_id: binary_sensor.touch_panel_slot_5_state
    on_state:
      - lvgl.widget.update:
          id: btn_l5
          state: { checked: !lambda 'return x;' }
  - platform: homeassistant
    id: slot6_state
    entity_id: binary_sensor.touch_panel_slot_6_state
    on_state:
      - lvgl.widget.update:
          id: btn_l6
          state: { checked: !lambda 'return x;' }
  - platform: homeassistant
    id: slot7_state
    entity_id: binary_sensor.touch_panel_slot_7_state
    on_state:
      - lvgl.widget.update:
          id: btn_l7
          state: { checked: !lambda 'return x;' }
  - platform: homeassistant
    id: slot8_state
    entity_id: binary_sensor.touch_panel_slot_8_state
    on_state:
      - lvgl.widget.update:
          id: btn_l8
          state: { checked: !lambda 'return x;' }
  # Scene/script slot kullanırsan zaten hep "kapalı" gösterir — sorun yok.

# ─────────────────────────────────────────── Yön algılama
# Her 500ms QMI8658'den raw accel oku → template sensor'lara publish + yön tahmini.
# Yön etiketleri ham haliyle (yatay/dikey/yan). Cihazı çevirerek log'dan ax/ay/az
# değerlerini doğrula, sonra dikey↔yatay sayfa geçişini ekleriz.

text_sensor:
  - platform: homeassistant
    id: ha_time
    entity_id: sensor.time
    on_value:
      - lvgl.label.update:
          id: lbl_clock
          text: !lambda 'return x.c_str();'
      - lvgl.label.update:
          id: lbl_clock_big
          text: !lambda 'return x.c_str();'

  - platform: homeassistant
    id: ha_date
    entity_id: ${date_entity}
    on_value:
      - lvgl.label.update:
          id: lbl_date
          text: !lambda 'return x.c_str();'

  # ──── Touch Panel Manager slot abonelikleri (entity + label per slot)
  # 7 slot kullanıyoruz (4 ana buton + 3 sahne yuvası); 8. slot reserve.
  # ──── Touch Panel Manager slot abonelikleri (v0.5: main+sub text)
  # 8 slot tam → 24 text_sensor (entity + main_text + sub_text per slot)
  - platform: homeassistant
    id: slot1_entity
    entity_id: ${panel_config_entity}
    attribute: slot_1_entity
  - platform: homeassistant
    id: slot1_main
    entity_id: ${panel_config_entity}
    attribute: slot_1_main_text
    on_value:
      - lvgl.label.update: { id: lbl_l1_main, text: !lambda 'return x.c_str();' }
  - platform: homeassistant
    id: slot1_sub
    entity_id: ${panel_config_entity}
    attribute: slot_1_sub_text
