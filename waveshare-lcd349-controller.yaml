  # Swipe gesture tracking
  - id: touch_start_x
    type: int16_t
    initial_value: '-1'
  - id: touch_start_y
    type: int16_t
    initial_value: '-1'
  - id: touch_last_x
    type: int16_t
    initial_value: '-1'
  - id: touch_last_y
    type: int16_t
    initial_value: '-1'
  - id: touch_start_ms
    type: uint32_t
    initial_value: '0'
  - id: is_swiping
    type: bool
    initial_value: 'false'

script:
  - id: show_remote_page
    then:
      - lvgl.page.show: scr_remote
  - id: show_dashboard_page
    then:
      - lvgl.page.show: scr_dashboard

  # 8 slot'un checked state'ini binary_sensor'lardan manuel sync et
  # (HA reconnect'te initial state'i yutma sorununa karşı failsafe)
  - id: refresh_button_states
    then:
      - lvgl.widget.update:
          id: btn_l1
          state: { checked: !lambda 'return id(slot1_state).state;' }
      - lvgl.widget.update:
          id: btn_l2
          state: { checked: !lambda 'return id(slot2_state).state;' }
      - lvgl.widget.update:
          id: btn_l3
          state: { checked: !lambda 'return id(slot3_state).state;' }
      - lvgl.widget.update:
          id: btn_l4
          state: { checked: !lambda 'return id(slot4_state).state;' }
      - lvgl.widget.update:
          id: btn_l5
          state: { checked: !lambda 'return id(slot5_state).state;' }
      - lvgl.widget.update:
          id: btn_l6
          state: { checked: !lambda 'return id(slot6_state).state;' }
      - lvgl.widget.update:
          id: btn_l7
          state: { checked: !lambda 'return id(slot7_state).state;' }
      - lvgl.widget.update:
          id: btn_l8
          state: { checked: !lambda 'return id(slot8_state).state;' }

  # Page navigation (kullanılır: prev/next butonu + swipe)
  - id: navigate_prev
    then:
      - homeassistant.action:
          action: touch_panel_manager.set_current_page
          data:
            config_entity_id: ${panel_config_entity}
            page_index: !lambda |-
              int curr = atoi(id(page_current).state.c_str());
              int total = atoi(id(page_count).state.c_str());
              if (total < 1) return std::string("0");
              int prev = curr - 1;
              if (prev < 0) prev = total - 1;
              return std::to_string(prev);
  - id: navigate_next
    then:
      - homeassistant.action:
          action: touch_panel_manager.set_current_page
          data:
            config_entity_id: ${panel_config_entity}
            page_index: !lambda |-
              int curr = atoi(id(page_current).state.c_str());
              int total = atoi(id(page_count).state.c_str());
              if (total < 1) return std::string("0");
              int next = curr + 1;
              if (next >= total) next = 0;
              return std::to_string(next);

interval:
  - interval: 500ms
    then:
      - lambda: |-
          auto *bus = id(bus_esp);
          uint8_t reg = 0x35;     // accel X low byte (sıralı okuma için)
          if (bus->write(0x6B, &reg, 1, false) != esphome::i2c::ERROR_OK) return;
          uint8_t buf[6];
          if (bus->read(0x6B, buf, 6) != esphome::i2c::ERROR_OK) return;
          int16_t rx = (int16_t)((buf[1] << 8) | buf[0]);
          int16_t ry = (int16_t)((buf[3] << 8) | buf[2]);
          int16_t rz = (int16_t)((buf[5] << 8) | buf[4]);
          // ±4g aralığı: 32768 / 4 = 8192 LSB/g
          float ax = rx / 8192.0f;
          float ay = ry / 8192.0f;
          float az = rz / 8192.0f;
          id(accel_x).publish_state(ax);
          id(accel_y).publish_state(ay);
          id(accel_z).publish_state(az);

          // Yön kararı: SADECE X ekseni belirleyici. Histerezis ile flicker önlendi.
          // |X| > 0.6g → dikey ;  |X| < 0.4g → yatay ;  ara bölge: önceki kalır.
          static int last_orient = -1;  // -1=henüz yok, 0=yatay, 1=dikey
          float aax = fabs(ax);
          int new_orient = last_orient;
          if (aax > 0.6f)      new_orient = 1;
          else if (aax < 0.4f) new_orient = 0;
          if (new_orient != last_orient) {
            last_orient = new_orient;
            ESP_LOGI("orient", "Orientation changed → %s", new_orient == 1 ? "portrait" : "landscape");
            if (new_orient == 1) id(show_remote_page).execute();
            else                 id(show_dashboard_page).execute();
          }
          id(device_orientation).publish_state(new_orient == 1 ? "portrait" : "landscape");

